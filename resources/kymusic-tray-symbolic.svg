<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="22" height="22">
  <defs>
    <style id="current-color-scheme" type="text/css">
      .ColorScheme-Text {
        color: #eff0f1;
      }
    </style>
  </defs>
  <g class="ColorScheme-Text" fill="currentColor">
    <!-- Equalizer bars (crisp 1.5px width) -->
    <rect x="3" y="11" width="1.5" height="6"/>
    <rect x="6" y="6" width="1.5" height="11"/>
    <rect x="9" y="8.5" width="1.5" height="8.5"/>

    <!-- Sharp beamed eighth notes -->
    <!-- Connecting beam -->
    <polygon points="12,5 18.5,3.5 18.5,5.2 12,6.7"/>
    <!-- Note stems -->
    <rect x="12" y="5" width="1.5" height="8.5"/>
    <rect x="17" y="3.5" width="1.5" height="8.5"/>
    <!-- Note heads (crisp angled geometric rhombuses) -->
    <polygon points="9.5,14.5 12.5,13 13.5,14 10.5,15.5"/>
    <polygon points="14.5,13 17.5,11.5 18.5,12.5 15.5,14"/>
  </g>
</svg>
