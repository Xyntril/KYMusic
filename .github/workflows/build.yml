name: Build KYMusic

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  ARTIFACT_RETENTION_DAYS: 14

jobs:

  # =============================================================
  # Linux x64 — AppImage + tar.gz (Debian 13 Trixie)
  # =============================================================

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie

    steps:

      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            curl \
            wget \
            file \
            patchelf \
            fuse3 \
            libfuse2t64 \
            desktop-file-utils \
            appstream \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-multimedia-dev \
            qt6-svg-dev \
            libtag1-dev \
            extra-cmake-modules \
            libkf6coreaddons-dev \
            libkf6colorscheme-dev \
            libkf6xmlgui-dev \
            libkf6statusnotifieritem-dev \
            libkf6iconthemes-dev \
            libkf6kirigami-dev \
            libkf6qqc2desktopstyle-dev \
            qml6-module-org-kde-kirigami \
            qml6-module-org-kde-desktop \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-effects \
            qml6-module-qt-labs-platform

          # Установка qqc2desktopstyle, если доступен под альтернативным именем
          for pkg in $(apt-cache search qqc2desktopstyle 2>/dev/null | awk '{print $1}'); do
            apt-get install -y "$pkg" || true
          done
          apt-get install -y qml6-module-org-kde-desktopstyle 2>/dev/null || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Safe Git Directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true

      - name: Extract version
        run: |
          VERSION="$(sed -nE '/^project\(/,/^\)/s/.*VERSION[[:space:]]+([0-9.]+).*/\1/p' CMakeLists.txt | head -1)"
          echo "VERSION=${VERSION:-1.0.0}" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/dist"

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Run Tests
        run: |
          ctest --test-dir build --output-on-failure

      - name: Install
        run: |
          rm -rf dist
          cmake --install build

      - name: Build AppImage and Tarball
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./scripts/build-appimage.sh

      - name: List artifacts
        run: |
          ls -la KYMusic-*

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: KYMusic-*.AppImage
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Upload tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: KYMusic-*.tar.gz
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # =============================================================
  # Проверка запуска AppImage в изолированном окружении
  # =============================================================

  linux-compat:
    name: AppImage start check (Debian Trixie)
    needs: [linux]
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie

    steps:

      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage

      - name: Install runtime tools
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y \
            xvfb \
            libgl1 \
            libopengl0 \
            libegl1 \
            libx11-xcb1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libsm6 \
            libice6 \
            libdbus-1-3 \
            libpulse0 \
            libsndfile1 \
            libfuse2t64 \
            fuse3

      - name: Start without network
        run: |
          chmod +x KYMusic-*.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          set +e
          xvfb-run -a timeout --signal=KILL 25 \
            ./KYMusic-*.AppImage --appimage-extract-and-run > app.log 2>&1
          code=$?

          cat app.log

          if [ "$code" -ne 124 ] && [ "$code" -ne 137 ]; then
            echo "::error::AppImage завершился сразу после запуска (код $code)"
            exit 1
          fi
          echo "OK: приложение не падает на старте"

      - name: Diagnose missing libraries
        if: failure()
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./KYMusic-*.AppImage --appimage-extract >/dev/null 2>&1 || true

          echo "--- не найдены на этой системе ---"
          ldd squashfs-root/usr/bin/kymusic 2>&1 | grep 'not found' || true

  # =============================================================
  # Release (только по тегам v*)
  # =============================================================

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, linux-compat]
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: |
          ls -la artifacts

      - name: Build release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          {
            echo "## KYMusic ${GITHUB_REF_NAME}"
            echo
            echo "Нативный клиент Яндекс Музыки для KDE Plasma и Plasma Mobile."
            echo
            echo "### Установка"
            echo
            echo "- **Linux AppImage:** \`KYMusic-${VERSION}-x86_64.AppImage\` (сделайте исполняемым: \`chmod +x\` и запустите)"
            echo "- **Linux Tarball:** \`KYMusic-${VERSION}-linux-x86_64.tar.gz\`"
            echo
          } > release-notes.md

          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[v?" ver "\\]" { inside = 1; next }
              inside && /^## \[/ { exit }
              inside { lines[++n] = $0 }
              END {
                start = 1
                while (start <= n && lines[start] ~ /^[[:space:]]*$/) start++
                end = n
                while (end >= start && (lines[end] ~ /^[[:space:]]*$/ || lines[end] == "---")) end--
                for (i = start; i <= end; i++) print lines[i]
              }
            ' CHANGELOG.md > changelog-section.md

            if [ -s changelog-section.md ]; then
              cat changelog-section.md >> release-notes.md
            fi
          fi

          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: KYMusic ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            artifacts/*.AppImage
            artifacts/*.tar.gz
